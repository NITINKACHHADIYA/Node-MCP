name: Feature request
description: Suggest an idea, a new framework adapter or an MCP feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: What would you like to write in your app?
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

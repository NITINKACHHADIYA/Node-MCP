version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) is not yet supported by tsup, typescript-eslint
      # and @swc-node/register (peer range < 7). Revisit when they add support.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
# When a maintenance branch (e.g. v3.x) exists, add a copy of the npm entry above
# with `target-branch: v3.x` so its dependencies keep receiving security updates.

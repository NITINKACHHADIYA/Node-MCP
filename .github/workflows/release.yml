name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch|minor|major && git push --follow-tags
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      # Provenance attestations require a public repository.
      - run: npm publish --access public ${{ github.event.repository.private && ' ' || '--provenance' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

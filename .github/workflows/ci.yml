name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]  # dev tooling (vitest 5) needs Node 22+; the library itself supports Node 18+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build          # examples typecheck against dist/
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Packs the library, installs it into one fresh project per framework/version
    # and drives each app with the official MCP SDK client.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
